name: CI
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: taskflow
          POSTGRES_PASSWORD: taskflow
          POSTGRES_DB: taskflow_test
        ports: [5432:5432]
        options: >-
          --health-cmd "pg_isready -U taskflow -d taskflow_test"
          --health-interval 5s --health-timeout 3s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx prisma generate --config=prisma.config.ts
      - run: npx prisma migrate deploy --config=prisma.config.ts
        env:
          DATABASE_URL: postgresql://taskflow:taskflow@localhost:5432/taskflow_test?schema=public
      - run: npm run build
      - run: npm test
        env:
          DATABASE_URL: postgresql://taskflow:taskflow@localhost:5432/taskflow_test?schema=public
          JWT_SECRET: integration-test-secret-at-least-32-characters-long
